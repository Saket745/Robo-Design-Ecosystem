name: Ecosystem Validation Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Run Ecosystem Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Node.js
        uses: actions/setup-node@601291d996c5b77ee10ff35523614b8a1fef2ad6 # v4.0.3
        with:
          node-version: 18

      - name: Validate Ecosystem Structure
        run: node scripts/validate-ecosystem.js
