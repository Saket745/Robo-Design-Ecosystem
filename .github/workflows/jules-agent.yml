# Jules AI Agent — Auto-trigger on labeled issues
# This workflow dispatches tasks to Jules when issues are labeled with 'jules'
#
# Prerequisites:
#   1. Install Jules GitHub App on this repo: https://jules.google
#   2. Generate a Jules API key from jules.google settings
#   3. Add it as a repo secret: Settings → Secrets → JULES_API_KEY

name: Jules Agent Dispatch

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  dispatch-to-jules:
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch task to Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          task: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            
            ${{ github.event.issue.body }}
            
            Instructions:
            - Read AGENTS.md for project context and conventions
            - Check docs/tasks/PRD.md for the full task specification
            - Follow conventional commit format
            - Do NOT modify files in 00_CORE_BRAIN, 01_GLOBAL_RULES, or 07_SECURITY
            - Run npm run validate before completing
          repo: ${{ github.repository }}
          branch: develop

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Jules has been dispatched!**\n\nA Jules agent is now working on this issue asynchronously. You will receive a Pull Request when the work is complete.\n\n> Check progress at [jules.google](https://jules.google)'
            })
